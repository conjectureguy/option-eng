[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "options-pricing-engine"
version = "1.0.0"
description = "European option pricing and portfolio risk analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["visualization"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pricing*", "risk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

